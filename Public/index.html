<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080d"><title>KuroBox — Gacha Business</title><style>
:root{--bg:#08080d;--card:#12121a;--card2:#181824;--line:#2a2a38;--text:#f6f6fb;--muted:#a8a8ba;--accent:#b58cff;--accent2:#6ee7ff;--good:#64e59a;--danger:#ff6b81}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#2b1646 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0}.app{max-width:720px;margin:auto;padding-bottom:86px}.top{position:sticky;top:0;z-index:10;background:rgba(8,8,13,.88);backdrop-filter:blur(18px);padding:16px}.brand{display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:900}.logo span{color:var(--accent)}.coins{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-weight:800}.hero{margin:14px 16px;padding:24px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,#171326,#11121c)}.hero h1{font-size:32px;line-height:1.05;margin:0 0 10px}.hero p{color:var(--muted);margin:0}.tabs{display:flex;gap:8px;overflow:auto;padding:0 16px 10px}.tabs button{white-space:nowrap;padding:10px 14px;border-radius:99px;background:var(--card);color:var(--muted);border:1px solid var(--line)}.tabs button.active{background:#2b2041;color:white;border-color:#684a98}.section{padding:10px 16px}.section h2{font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:linear-gradient(145deg,var(--card),#0f0f16);border:1px solid var(--line);border-radius:20px;padding:14px}.box-art{height:125px;border-radius:15px;background:radial-gradient(circle,#49346b,#181824 65%);display:grid;place-items:center;font-size:48px;margin-bottom:12px}.rarity{color:var(--accent2);font-size:12px;font-weight:800}.price{font-weight:900;margin:7px 0}.muted{color:var(--muted);font-size:13px}.primary{width:100%;padding:12px;border-radius:14px;background:linear-gradient(135deg,#9d6cff,#5d8cff);color:white;font-weight:900;cursor:pointer}.secondary{padding:10px 12px;border-radius:12px;background:var(--card2);color:white;border:1px solid var(--line)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(9,9,14,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.bottom-inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{background:none;color:var(--muted);padding:12px 4px;font-size:12px}.bottom button.active{color:white}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;display:none;align-items:end}.sheet{width:100%;max-width:720px;margin:auto;background:#101018;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px;max-height:88vh;overflow:auto}.modal.show{display:flex}.input{width:100%;background:#0b0b11;border:1px solid var(--line);color:white;padding:13px;border-radius:13px;margin:7px 0}.result{text-align:center;padding:20px}.prize{font-size:60px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#29203b;color:#d8c6ff;font-size:11px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none}.empty{padding:30px;text-align:center;color:var(--muted)}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🦊 Kuro<span>Box</span></div><div class="coins">🪙 <span id="coins">0</span></div></div></header><main id="main"></main></div><nav class="bottom"><div class="bottom-inner"><button onclick="show('home')" id="n-home">🏠<br>Beranda</button><button onclick="show('gacha')" id="n-gacha">🎰<br>Gacha</button><button onclick="show('inventory')" id="n-inventory">🎁<br>Inventori</button><button onclick="show('account')" id="n-account">👤<br>Akun</button></div></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const API='/api';let token=localStorage.getItem('kuro_token')||'';let me=null;let boxes=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'content-type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(r.status===401&&path!='/auth/login'){token='';localStorage.removeItem('kuro_token');me=null}if(!r.ok)throw new Error(d.error||'Terjadi kesalahan');return d}
async function load(){try{const b=await api('/boxes');boxes=b.boxes||[];try{me=(await api('/me')).user}catch{};render();}catch(e){document.getElementById('main').innerHTML='<div class="hero"><h1>Backend belum tersambung</h1><p>'+esc(e.message)+'</p></div>'}}
function render(){show('home')}
function nav(id){document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+id)?.classList.add('active')}
function show(page){nav(page==='home'?'home':page);let m=document.getElementById('main');if(page==='home')m.innerHTML=`<section class="hero"><h1>Buka Box.<br>Raih Kejutannya.</h1><p>Gacha collectible KuroBox. Probabilitas dan stok hadiah ditampilkan transparan.</p></section><div class="section"><div class="row"><h2>🔥 Gacha pilihan</h2><span class="pill">SERVER-SIDE</span></div><div class="grid">${boxes.map(boxCard).join('')}</div></div>`;if(page==='gacha')m.innerHTML=`<div class="section"><h2>🎰 Semua Gacha</h2><div class="grid">${boxes.map(boxCard).join('')}</div></div>`;if(page==='inventory')loadInventory();if(page==='account')account()}
function boxCard(b){return `<article class="card"><div class="box-art">🎁</div><div class="rarity">LIVE • PROBABILITAS</div><h3>${esc(b.name)}</h3><div class="muted">${esc(b.description)}</div><div class="price">🪙 ${b.price_coins} Koin</div><button class="primary" onclick="openGacha('${esc(b.id)}')">Buka Box</button></article>`}
function openGacha(id){const b=boxes.find(x=>x.id===id);if(!b)return;document.getElementById('sheet').innerHTML=`<div class="row"><h2>${esc(b.name)}</h2><button class="secondary" onclick="closeModal()">✕</button></div><p class="muted">Harga ${b.price_coins} koin. Hadiah dipilih oleh server berdasarkan bobot probabilitas yang tersedia.</p><div>${b.rewards.map(r=>`<div class="card" style="margin:8px 0"><div class="row"><div><b>${esc(r.name)}</b><div class="muted">${esc(r.rarity)} • stok ${r.stock}</div></div><b>${r.probability}%</b></div></div>`).join('')}</div><button class="primary" onclick="spin('${esc(b.id)}')">🎰 GACHA SEKARANG</button>`;document.getElementById('modal').classList.add('show')}
async function spin(id){if(!token){closeModal();return login(true)}const sheet=document.getElementById('sheet');sheet.innerHTML='<div class="result"><div class="prize">🎲</div><h2>Mengundi hadiah...</h2><p class="muted">Hasil ditentukan server.</p></div>';try{const d=await api('/gacha',{method:'POST',body:JSON.stringify({boxId:id})});me.coins=d.coins;document.getElementById('coins').textContent=me.coins;sheet.innerHTML=`<div class="result"><div class="prize">🎉</div><span class="pill">${esc(d.reward.rarity)}</span><h2>${esc(d.reward.name)}</h2><p class="muted">Hadiah masuk ke inventori kamu.</p><button class="primary" onclick="closeModal();show('inventory')">Lihat Inventori</button></div>`}catch(e){sheet.innerHTML='<div class="result"><div class="prize">⚠️</div><h3>'+esc(e.message)+'</h3><button class="secondary" onclick="closeModal()">Tutup</button></div>'}}
async function loadInventory(){const m=document.getElementById('main');if(!token){m.innerHTML='<div class="section"><div class="hero"><h2>🎁 Inventori</h2><p>Login untuk melihat hadiah kamu.</p><button class="primary" onclick="login()">Login</button></div></div>';return}try{const d=await api('/inventory');m.innerHTML='<div class="section"><h2>🎁 Inventori Saya</h2>'+((d.inventory||[]).map(x=>`<div class="card" style="margin:10px 0"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.box_name)} • ${esc(x.rarity)}</div></div><span class="pill">${esc(x.status)}</span></div></div>`).join('')||'<div class="empty">Belum ada hadiah.</div>')+'</div>'}catch(e){m.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function account(){const m=document.getElementById('main');if(!me){m.innerHTML='<div class="section"><div class="hero"><h2>👤 Akun KuroBox</h2><p>Login untuk menyimpan saldo, gacha dan inventori.</p><button class="primary" onclick="login()">Login / Daftar</button></div></div>';return}m.innerHTML=`<div class="section"><div class="hero"><h2>Halo, ${esc(me.name)} 👋</h2><p>${esc(me.email)}</p><h2>🪙 ${me.coins} Koin</h2></div><button class="secondary" onclick="logout()">Keluar</button></div>`}
function login(register=false){document.getElementById('sheet').innerHTML=`<h2>${register?'Login untuk Gacha':'Login / Daftar'}</h2><input class="input" id="email" placeholder="Email"><input class="input" id="name" placeholder="Nama (wajib saat daftar)"><input class="input" id="password" type="password" placeholder="Password minimal 8 karakter"><div class="row"><button class="secondary" onclick="closeModal()">Batal</button><button class="primary" onclick="submitAuth()">Masuk / Daftar</button></div><p class="muted">Jika email belum ada, akun akan dibuat otomatis.</p>`;document.getElementById('modal').classList.add('show')}
async function submitAuth(){try{const email=document.getElementById('email').value,name=document.getElementById('name').value,password=document.getElementById('password').value;let d;try{d=await api('/auth/login',{method:'POST',body:JSON.stringify({email,password})})}catch{d=await api('/auth/register',{method:'POST',body:JSON.stringify({email,name,password})})}token=d.token;localStorage.setItem('kuro_token',token);me=d.user;document.getElementById('coins').textContent=me.coins;closeModal();show('account')}catch(e){alert(e.message)}}
function logout(){token='';me=null;localStorage.removeItem('kuro_token');document.getElementById('coins').textContent='0';show('account')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});load();
</script></body></html>
