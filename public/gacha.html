<script>

let currentUser=null;


/* API */

async function api(url,options={}){

  const response=await fetch(url,{
    credentials:"same-origin",
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });

  let data;

  try{
    data=await response.json();
  }catch{
    data={
      ok:false,
      error:"Response server tidak valid."
    };
  }

  return{
    status:response.status,
    data
  };
}


/* SESSION */

async function checkSession(){

  try{

    const result=await api("/api/me");

    if(!result.data.ok){

      showLoginRequired();
      return;

    }

    currentUser=result.data.user;

    document
      .getElementById("loginMessage")
      .classList.add("hidden");

    document
      .getElementById("gachaPage")
      .classList.remove("hidden");

    document
      .getElementById("coinDisplay")
      .classList.remove("hidden");

    updateCoins();

    loadBoxes();

  }catch(error){

    showLoginRequired();

  }

}


/* LOGIN REQUIRED */

function showLoginRequired(){

  document.getElementById("loginMessage").innerHTML=`

    <div style="text-align:center">

      <div style="font-size:45px">
        🔐
      </div>

      <h2>Silakan Login</h2>

      <p class="message">
        Kamu harus login terlebih dahulu
        untuk menggunakan Gacha.
      </p>

      <button onclick="go('/')">
        Login / Daftar
      </button>

    </div>

  `;

}


/* COINS */

function updateCoins(){

  document.getElementById("coins").textContent=
    Number(currentUser?.coins||0)
      .toLocaleString("id-ID");

}


/* LOAD BOXES */

async function loadBoxes(){

  const container=document.getElementById("boxes");

  try{

    const result=await api("/api/boxes");

    if(!result.data.ok){

      container.innerHTML=`

        <div class="card empty">
          ${escapeHtml(
            result.data.error ||
            "Gagal memuat box."
          )}
        </div>

      `;

      return;

    }

    const boxes=result.data.boxes||[];

    if(!boxes.length){

      container.innerHTML=`

        <div class="card empty">
          Belum ada mystery box.
        </div>

      `;

      return;

    }

    container.innerHTML=boxes.map(box=>`

      <div class="card">

        <div class="box-top">

          <div class="box-art">
            🎁
          </div>

          <div>

            <div class="box-name">
              ${escapeHtml(box.name)}
            </div>

            <div class="description">
              ${escapeHtml(
                box.description ||
                "Mystery collectible"
              )}
            </div>

            <div class="price">
              🪙 ${Number(
                box.price_coins
              ).toLocaleString("id-ID")} coins
            </div>

          </div>

        </div>

        <div class="actions">

          <button
            onclick="playGacha(
              ${Number(box.id)},
              '${escapeAttr(box.name)}',
              ${Number(box.price_coins)}
            )">

            🎲 Buka Box

          </button>

        </div>

      </div>

    `).join("");

  }catch(error){

    container.innerHTML=`

      <div class="card empty">
        Gagal memuat mystery box.
      </div>

    `;

    console.error(error);

  }

}


/* GACHA */

async function playGacha(boxId,boxName,price){

  if(!currentUser){

    alert("Silakan login terlebih dahulu.");
    return;

  }

  if(Number(currentUser.coins)<Number(price)){

    alert(
      "Coins tidak cukup.\n\n"+
      "Harga: "+
      Number(price).toLocaleString("id-ID")+
      "\nSaldo: "+
      Number(currentUser.coins)
        .toLocaleString("id-ID")
    );

    return;

  }

  if(!confirm(

    "Buka "+boxName+"?\n\n"+
    "Harga: "+
    Number(price).toLocaleString("id-ID")+
    " coins"

  )) return;


  document
    .querySelectorAll("#boxes button")
    .forEach(button=>{
      button.disabled=true;
    });


  try{

    const result=await api("/api/gacha",{

      method:"POST",

      body:JSON.stringify({
        box_id:boxId
      })

    });


    if(!result.data.ok){

      alert(
        result.data.error ||
        "Gacha gagal."
      );

      return;

    }


    currentUser=result.data.user;

    updateCoins();

    showReward(
      result.data.reward
    );


  }catch(error){

    console.error(error);

    alert(
      "Terjadi kesalahan saat membuka gacha."
    );

  }finally{

    document
      .querySelectorAll("#boxes button")
      .forEach(button=>{
        button.disabled=false;
      });

  }

}


/* REWARD */

function showReward(reward){

  const section=
    document.getElementById(
      "rewardSection"
    );

  const name=
    document.getElementById(
      "rewardName"
    );

  const probability=
    document.getElementById(
      "rewardProbability"
    );


  const rarity=
    reward?.rarity ||
    "Common";


  const icon={

    Common:"✨",
    Rare:"💎",
    Epic:"🔮",
    Legendary:"👑"

  };


  name.textContent=
    (icon[rarity]||"✨")+
    " "+
    (reward?.name||
     "Mystery Item");


  probability.textContent=
    rarity+
    " • Probability: "+
    Number(
      reward?.probability||0
    )+
    "%";


  section.classList.remove(
    "hidden"
  );


  section.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


/* NAVIGATION */

function go(path){

  window.location.href=path;

}


/* ESCAPE */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value??"")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


/* START */

checkSession();

</script>
