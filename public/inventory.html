<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KuroBox — Inventory</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08080d;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
  max-width:760px;
  margin:auto;
  padding:20px 16px 110px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:30px;
  font-weight:950;
}

.brand b{
  color:#ff4ca5;
}

.subtitle{
  color:#858592;
  font-size:13px;
  margin-top:3px;
}

.coins{
  padding:10px 14px;
  border:1px solid #343441;
  border-radius:14px;
  background:#15151d;
  font-weight:850;
}

.section{
  margin-top:28px;
}

.title h2{
  margin:0 0 12px;
  font-size:22px;
}

.card{
  padding:18px;
  margin-top:12px;
  border:1px solid #292934;
  border-radius:20px;
  background:#111118;
}

.inventory-item{
  display:flex;
  align-items:center;
  gap:13px;
}

.item-icon{
  width:50px;
  height:50px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1d1721;
  border:1px solid #39303c;
  font-size:25px;
}

.item-info{
  flex:1;
}

.item-name{
  font-weight:850;
}

.item-date{
  color:#777783;
  font-size:11px;
  margin-top:3px;
}

.status{
  font-size:11px;
  color:#9cf27e;
  background:#182717;
  border-radius:999px;
  padding:5px 8px;
}

.empty{
  color:#777783;
  text-align:center;
  padding:22px;
}

.error{
  color:#ff7b9c;
  text-align:center;
  padding:22px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:center;
  padding:10px 12px 14px;
  background:rgba(8,8,13,.94);
  border-top:1px solid #292934;
  backdrop-filter:blur(12px);
}

.nav-inner{
  width:min(760px,100%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.nav-btn{
  text-decoration:none;
  color:#888894;
  text-align:center;
  padding:10px 5px;
  border-radius:14px;
  font-size:12px;
}

.nav-btn.active{
  color:#fff;
  background:#181820;
}

button{
  border:0;
  border-radius:13px;
  padding:12px 16px;
  color:#fff;
  background:#ff3d96;
  cursor:pointer;
}
</style>
</head>

<body>

<main>

  <div class="topbar">

    <div>
      <div class="brand">
        Kuro<b>Box</b>
      </div>

      <div class="subtitle">
        Inventory
      </div>
    </div>

    <div id="coinDisplay" class="coins">
      🪙 0
    </div>

  </div>


  <section class="section">

    <div class="title">
      <h2>🎒 Inventory</h2>
    </div>

    <div id="inventoryList">

      <div class="empty">
        Memuat inventory...
      </div>

    </div>

  </section>

</main>


<nav class="bottom-nav">

  <div class="nav-inner">

    <a class="nav-btn" href="/">
      🏠<br>
      Home
    </a>

    <a class="nav-btn" href="/gacha.html">
      🎁<br>
      Gacha
    </a>

    <a class="nav-btn active" href="/inventory.html">
      🎒<br>
      Inventory
    </a>

    <a class="nav-btn" href="/profile.html">
      👤<br>
      Profil
    </a>

  </div>

</nav>


<script>

let currentUser = null;


async function api(url, options = {}) {

  const res = await fetch(url, {
    credentials:"same-origin",
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    }
  });

  const data = await res.json().catch(() => null);

  if(!res.ok){

    throw new Error(
      data?.error ||
      data?.message ||
      `HTTP ${res.status}`
    );

  }

  return data;
}


async function checkSession(){

  try{

    const result = await api("/api/me");

    currentUser =
      result?.data?.user ||
      result?.user ||
      null;


    if(!currentUser){

      showMessage(
        "Silakan login terlebih dahulu."
      );

      return;

    }


    document.getElementById("coinDisplay").textContent =
      `🪙 ${currentUser.coins ?? 0}`;


    await loadInventory();

  }catch(err){

    console.error("Session error:",err);

    showMessage(
      "Silakan login terlebih dahulu."
    );

  }

}


async function loadInventory(){

  const container =
    document.getElementById("inventoryList");


  if(!container){

    console.error(
      "inventoryList tidak ditemukan"
    );

    return;

  }


  container.innerHTML = `
    <div class="empty">
      Memuat inventory...
    </div>
  `;


  try{

    const result =
      await api("/api/inventory");


    const items =
      result?.data?.items ||
      result?.data?.inventory ||
      result?.items ||
      result?.inventory ||
      [];


    if(!Array.isArray(items) || items.length === 0){

      container.innerHTML = `
        <div class="empty">
          Inventory kamu masih kosong.
        </div>
      `;

      return;

    }


    container.innerHTML =
      items.map(item => {

        const name =
          item.name ||
          item.reward_name ||
          item.item_name ||
          "Reward";


        const rarity =
          item.rarity ||
          "Common";


        const date =
          item.created_at ||
          item.date ||
          "";


        return `

          <div class="card inventory-item">

            <div class="item-icon">
              🎁
            </div>

            <div class="item-info">

              <div class="item-name">
                ${escapeHtml(name)}
              </div>

              <div class="item-date">
                ${escapeHtml(date)}
              </div>

            </div>

            <div class="status">
              ${escapeHtml(rarity)}
            </div>

          </div>

        `;

      }).join("");


  }catch(err){

    console.error(
      "Inventory error:",
      err
    );


    container.innerHTML = `
      <div class="error">
        Gagal memuat inventory.
      </div>
    `;

  }

}


function showMessage(message){

  const container =
    document.getElementById("inventoryList");


  if(container){

    container.innerHTML = `
      <div class="empty">
        ${escapeHtml(message)}
      </div>
    `;

  }

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


checkSession();

</script>

</body>
</html>
